<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Youuuuuuuuu ❤️</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #ffc0cb, #ff99aa);
      text-align: center;
      color: white;
      cursor: none;
    }

    h1 {
      margin-top: 100px;
      font-size: 2.5rem;
    }

    #typing {
      font-size: 1.2rem;
      margin-top: 10px;
      min-height: 30px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff4d6d;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .float {
      position: absolute;
      font-size: 24px;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }

    .butterfly {
      position: absolute;
      font-size: 24px;
      animation: fly linear infinite;
    }

    @keyframes fly {
      from { transform: translateX(-10vw); }
      to { transform: translateX(110vw); }
    }

    .cursor-heart {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      animation: fade 1s linear forwards;
    }

    @keyframes fade {
      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }
  </style>
</head>

<body>

<h1>Heeloooooooooooooooo Aasheeeeeeeeeeeeeeee cutuuuuuuuuuu 💖</h1>
<p id="typing"></p>

<button onclick="showLove()">Tap for Love 💌</button>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
  function showLove() {
    alert("I love you so much mera bachhaaaaaa ❤️");
  }

  const text = "I know these days are tough... but I'm always here for you ❤️";
  let i = 0;
  function type() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 40);
    }
  }
  type();

  function createFloating(item, className) {
    const el = document.createElement("div");
    el.innerHTML = item;
    el.className = className;

    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (5 + Math.random() * 5) + "s";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 10000);
  }

  setInterval(() => createFloating("❤️", "float"), 500);
  setInterval(() => createFloating("🍫", "float"), 700);
  setInterval(() => createFloating("🦋", "butterfly"), 1000);

  document.addEventListener("mousemove", (e) => {
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "cursor-heart";

    heart.style.left = e.pageX + "px";
    heart.style.top = e.pageY + "px";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  });
</script>

</body>
</html>
